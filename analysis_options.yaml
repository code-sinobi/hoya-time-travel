include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - lib/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  plugins:
    - dart_code_metrics

dart_code_metrics:
  metrics:
    cyclomatic-complexity: 20
    number-of-parameters: 4
    maximum-nesting-level: 5
  metrics-exclude:
    - test/**
  rules:
    - avoid-dynamic
    - avoid-passing-async-when-sync-expected
    - avoid-redundant-async
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-unused-parameters
    - binary-expression-operand-order
    - double-literal-format
    - newline-before-return
    - no-boolean-literal-compare
    - no-empty-block
    - no-equal-then-else
    - no-object-declaration
    - prefer-trailing-comma
    - prefer-conditional-expressions
    - prefer-first
    - prefer-last
    # Design Governance Rules
    - ban-name:
        entries:
        - ident: Colors.red
          description: "Use MythicColors.error or MythicColors.ochreRed instead."
        - ident: Colors.blue
          description: "Use MythicColors.deepIndigo instead."
        - ident: Colors.green
          description: "Use MythicColors.success instead."
        - ident: Colors.yellow
          description: "Use MythicColors.warning instead."
        - ident: Colors.cyan
          description: "Sci-fi colors are banned! Use MythicColors."
        - ident: Colors.purple
          description: "Use EraTheme colors."
        - ident: Colors.orange
          description: "Use MythicColors.bronze instead."

linter:
  rules:
    # Code quality
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    always_declare_return_types: true
    avoid_print: true
    
    # Widget best practices
    use_key_in_widget_constructors: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    
    # Code style
    require_trailing_commas: true
    prefer_single_quotes: true
    sort_child_properties_last: true
