name: hoya_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  go_router: ^17.0.1
  supabase_flutter: ^2.12.0
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^8.0.0
  lottie: ^3.3.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  uuid: ^4.5.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  font_awesome_flutter: ^10.7.0
  animated_text_kit: ^4.2.2
  particles_flutter: ^0.1.3
  simple_animations: ^5.0.0
  accessibility_tools: ^2.8.0
  widgetbook: ^3.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned to older versions for compatibility with riverpod_generator 2.4.0
  build_runner: ^2.4.8
  json_serializable: ^6.9.5
  riverpod_generator: ^2.4.0
  integration_test:
    sdk: flutter

dependency_overrides:
  # Override required to resolve version conflict between flutter_test and other dependencies
  test_api: 0.7.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - .env
