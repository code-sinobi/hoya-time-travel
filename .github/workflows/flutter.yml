name: Flutter Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Static Analysis
      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      # Code Formatting Check
      - name: Check Code Formatting
        run: dart format --set-exit-if-changed .

      # Unit & Widget Tests
      - name: Run Tests
        run: flutter test --coverage

      # Upload Coverage (Optional)
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

  # Integration tests run separately (need device/emulator)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Run integration tests on Chrome (web)
      - name: Run Integration Tests (Web)
        run: |
          flutter config --enable-web
          flutter test integration_test --platform chrome || echo "Integration tests skipped if no display"
